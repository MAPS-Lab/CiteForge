name: CiteForge Refresh Merged

# Fires only when a refresh pull request actually lands on main. Convergence is
# upstream of publication: a generation can converge while its pull request sits
# unreviewed, is closed, or fails Required CI. main carrying the corpus is the
# real event.

on:
  pull_request:
    types: [closed]
    branches: [main]
  # A manual replay, dry by default: the website then pushes its import to a
  # publications/dry-run branch and leaves main, and mapslab.tech, untouched.
  workflow_dispatch:
    inputs:
      merge_sha:
        description: 'CiteForge commit the website should publish (40 hex chars)'
        required: true
      dry_run:
        description: 'Website pushes to a dry-run branch instead of main'
        type: boolean
        default: true

permissions:
  contents: read

# A closed pull request raises this event once, so the dispatch is one per
# merge by construction. The group serializes a manual replay against it
# rather than cancelling, because a cancelled dispatch is not a skipped one.
concurrency:
  group: citeforge-website-sync
  cancel-in-progress: false

jobs:
  sync-website:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'data/refresh-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Fails first when the secret is unset or rejected. Prints only the
      # token's length and the login it authenticates as, never the value.
      - name: Check CITEFORGE_BOT_TOKEN
        env:
          GH_TOKEN: ${{ secrets.CITEFORGE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          echo "CITEFORGE_BOT_TOKEN length: ${#GH_TOKEN}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CITEFORGE_BOT_TOKEN is empty"
            exit 1
          fi
          echo "CITEFORGE_BOT_TOKEN authenticates as $(gh api user --jq .login)"

      # A dispatch needs contents:write on the target. CITEFORGE_BOT_TOKEN is
      # the owner's fine-grained token, limited to this repository and the website.
      - name: Trigger mapslab-website publication sync
        env:
          GH_TOKEN: ${{ secrets.CITEFORGE_BOT_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || inputs.merge_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || 'manual-replay' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # The candidate the website must publish is the merge commit, not the
          # branch head. merge_commit_sha is null while GitHub is still computing
          # the merge, and dispatching a null candidate would point the website
          # at nothing, so the shape is checked before anything is sent.
          if ! printf '%s' "$MERGE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refresh ${HEAD_REF} reports no merge commit SHA; not dispatching"
            exit 1
          fi
          echo "::notice::Refresh ${HEAD_REF} merged as ${MERGE_SHA}; dispatching website sync (dry_run=${DRY_RUN})"
          gh api repos/gabrielspadon/mapslab-website/dispatches \
            --method POST \
            -f event_type=citeforge-refresh \
            -f "client_payload[merge_sha]=${MERGE_SHA}" \
            -f "client_payload[head_ref]=${HEAD_REF}" \
            -f "client_payload[dry_run]=${DRY_RUN}"
