name: Monthly Refresh Shadow Diagnostics

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citeforge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Legacy refresh diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-build.lock -r requirements.lock
          pip install --no-build-isolation --no-deps -e .

      - name: Write API keys from secrets
        env:
          S2_KEY: ${{ secrets.SEMANTICSCHOLAR }}
          SERPAPI_KEY: ${{ secrets.SERPAPI }}
          SERPLY_KEY: ${{ secrets.SERPLY }}
          GEMINI_KEY: ${{ secrets.GEMINI }}
          OPENREVIEW_KEY: ${{ secrets.OPENREVIEW }}
        run: |
          mkdir -p keys
          echo "$S2_KEY" > keys/Semantic.key
          echo "$SERPAPI_KEY" > keys/SerpAPI.key
          echo "$SERPLY_KEY" > keys/Serply.key
          echo "$GEMINI_KEY" > keys/Gemini.key
          echo "$OPENREVIEW_KEY" > keys/OpenReview.key

      - name: Run one legacy refresh for diagnostics
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          CITEFORGE_MAX_WORKERS: "16"
          CITEFORGE_CONCURRENCY: "20"
        run: |
          python3 main.py
          echo "Legacy refresh completed for diagnostics only. This workflow cannot publish output."
