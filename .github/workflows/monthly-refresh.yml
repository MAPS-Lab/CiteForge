name: Monthly Pipeline Refresh

on:
  schedule:
    - cron: '0 4 1 * *'  # 4 AM UTC on the 1st of each month (midnight AST)
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      converged: ${{ steps.loop.outputs.converged }}
      runs_completed: ${{ steps.loop.outputs.runs_completed }}
      last_api_calls: ${{ steps.loop.outputs.last_api_calls }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-build.lock -r requirements.lock
          pip install --no-build-isolation --no-deps -e .

      - name: Write API keys from secrets
        env:
          S2_KEY: ${{ secrets.SEMANTICSCHOLAR }}
          SERPAPI_KEY: ${{ secrets.SERPAPI }}
          SERPLY_KEY: ${{ secrets.SERPLY }}
          GEMINI_KEY: ${{ secrets.GEMINI }}
          OPENREVIEW_KEY: ${{ secrets.OPENREVIEW }}
        run: |
          mkdir -p keys
          echo "$S2_KEY"        > keys/Semantic.key
          echo "$SERPAPI_KEY"   > keys/SerpAPI.key
          echo "$SERPLY_KEY"    > keys/Serply.key
          echo "$GEMINI_KEY"    > keys/Gemini.key
          echo "$OPENREVIEW_KEY" > keys/OpenReview.key

      - name: Restore cache from data-cache branch
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          if [ -z "$CACHE_ENCRYPTION_KEY" ]; then
            echo "CACHE_ENCRYPTION_KEY unset — skipping cache restore (fresh start)"
          elif git ls-remote --heads origin data-cache | grep -q data-cache; then
            git fetch origin data-cache
            rm -f /tmp/api_cache.tar.gz.enc /tmp/api_cache.tar.gz
            if git show origin/data-cache:api_cache.tar.gz.enc > /tmp/api_cache.tar.gz.enc 2>/dev/null; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_ENCRYPTION_KEY \
                   -in /tmp/api_cache.tar.gz.enc -out /tmp/api_cache.tar.gz 2>/dev/null; then
                mkdir -p data
                tar xzf /tmp/api_cache.tar.gz -C data/
                echo "Restored $(find data/api_cache -type f | wc -l) cache entries"
              else
                echo "Cache decrypt failed (key rotated?) — starting fresh"
              fi
            fi
          else
            echo "No data-cache branch — starting fresh"
          fi

      - name: Run pipeline loop
        id: loop
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          CITEFORGE_MAX_WORKERS: "16"
          CITEFORGE_CONCURRENCY: "20"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          save_cache() {
            if [ -z "$CACHE_ENCRYPTION_KEY" ]; then
              echo "CACHE_ENCRYPTION_KEY unset — skipping cache push (raw API responses must not reach the public data-cache branch)"
              return 0
            fi
            if [ ! -d data/api_cache ]; then
              return 0
            fi
            first_entry=$(find data/api_cache -mindepth 1 -print -quit) || return 1
            if [ -z "$first_entry" ]; then
              return 0
            fi

            entries=$(find data/api_cache -type f -name '*.json' | wc -l) || return 1
            cache_tmp=$(mktemp -d) || return 1
            (
              trap 'status=$?; rm -rf "$cache_tmp" || status=1; exit "$status"' EXIT
              archive_path="$cache_tmp/api_cache.tar.gz"
              encrypted_path="$cache_tmp/api_cache.tar.gz.enc"
              cache_dir="$cache_tmp/repo"
              rm -f "$archive_path" "$encrypted_path" || exit 1
              tar czf "$archive_path" -C data api_cache || exit 1
              openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_ENCRYPTION_KEY \
                -in "$archive_path" -out "$encrypted_path" || exit 1
              size=$(du -h "$encrypted_path" | cut -f1) || exit 1
              echo "Saving $entries cache entries ($size encrypted)"

              # Push cache from an isolated temporary repository without disturbing the working tree.
              mkdir "$cache_dir" || exit 1
              cp "$encrypted_path" "$cache_dir/api_cache.tar.gz.enc" || exit 1
              cd "$cache_dir" || exit 1
              git init -q || exit 1
              git config user.name "github-actions[bot]" || exit 1
              git config user.email "github-actions[bot]@users.noreply.github.com" || exit 1
              git checkout --orphan data-cache || exit 1
              git add api_cache.tar.gz.enc || exit 1
              commit_date=$(date +%Y-%m-%d) || exit 1
              git commit -q -m "cache: $commit_date — $entries entries ($size, encrypted)" || exit 1
              git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" || exit 1
              pushed=false
              for attempt in 1 2 3; do
                if git push origin data-cache --force -q 2>/dev/null; then
                  pushed=true
                  break
                fi
                echo "Cache push attempt $attempt failed — retrying in ${attempt}0s..."
                sleep "${attempt}0" || exit 1
              done
              if [ "$pushed" != true ]; then
                echo "::error::Cache push failed after 3 attempts"
                exit 1
              fi
            )
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A digest-based convergence test needs at most one confirming sweep
          # after the corpus stops moving, so the 50-pass ceiling that the
          # API-delta test needed is gone. Ten is a runaway guard, not a target.
          max_runs=10
          converged=false
          prev_digest=""
          last_total=-1
          # 300 of the job's 360 minutes, leaving the commit, the branch push
          # and the pull request outside the loop's budget.
          LOOP_BUDGET_SECONDS=18000
          loop_started=$(date +%s)

          for i in $(seq 1 $max_runs); do
            echo "::group::Pipeline run $i/$max_runs"
            rc=0
            python3 main.py || rc=$?
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::error::Pipeline run $i failed with exit code $rc"
              echo "Saving cache before exit..."
              cache_rc=0
              save_cache "$i" || cache_rc=$?
              echo "converged=false" >> "$GITHUB_OUTPUT"
              echo "runs_completed=$i" >> "$GITHUB_OUTPUT"
              echo "last_api_calls=-1" >> "$GITHUB_OUTPUT"
              if [ "$cache_rc" -ne 0 ]; then
                echo "::error::Cache save failed while handling pipeline failure"
              fi
              exit 1
            fi

            # Reported for observability only. This counter is logical, not
            # physical: it counts operations, not sends, so a retry storm is
            # invisible to it. It must not gate anything.
            total=$(grep -aoP 'Total API calls: \K\d+' output/run.log 2>/dev/null || echo "-1")
            last_total=$total

            # Convergence is "this iteration changed nothing that gets
            # published", read off the corpus itself. The previous test
            # compared the API-call count between iterations and declared
            # convergence when the delta fell to 50 or less. It never fired:
            # the August 2026 chain went 3121, 2686, 2447, 2233, deltas of
            # 435, 239 and 214, so the loop ran to the six-hour ceiling and
            # the runner was cancelled. It also needed three to four full
            # corpus sweeps to decide, and four warm sweeps at the measured
            # 82.35 min do not fit in the 360 min budget.
            # NUL-delimited throughout: author directories are named
            # "Surname (ScholarID)" and the space splits under plain xargs,
            # which leaves sha256sum reading a subset and reporting a digest
            # that is stable from the first iteration. That reads as instant
            # convergence and would publish an unfinished corpus.
            digest=$(find output -type f \( -name '*.bib' -o -name 'summary.csv' -o -name 'baseline.json' \) -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)
            echo "Run $i — corpus digest ${digest:0:12} — API calls: $total"

            # Save cache after every iteration
            if ! save_cache "$i"; then
              echo "::error::Cache save failed after successful pipeline run $i"
              exit 1
            fi

            if [ "$digest" = "$prev_digest" ]; then
              echo "Corpus unchanged across two consecutive runs — converged"
              converged=true
              break
            fi
            prev_digest=$digest

            # Stop leasing new work with room left for the commit and the pull
            # request, rather than being cancelled mid-iteration at the ceiling.
            elapsed=$(( $(date +%s) - loop_started ))
            if [ "$elapsed" -ge "$LOOP_BUDGET_SECONDS" ]; then
              echo "::notice::Wall budget reached after $i run(s); exiting to publish what is complete"
              break
            fi

            if [ "$i" -eq "$max_runs" ]; then
              echo "Reached $max_runs runs without full convergence"
            fi
          done

          echo "converged=$converged" >> "$GITHUB_OUTPUT"
          echo "runs_completed=$i" >> "$GITHUB_OUTPUT"
          echo "last_api_calls=$last_total" >> "$GITHUB_OUTPUT"

      # Fresh token minted here (not at checkout): the pipeline loop can run for
      # hours and an app token lives only 1h, so mint it immediately before the push.
      - name: Generate push token
        id: push_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      # Publication goes through a pull request, never a direct push. Repo
      # ruleset 10020080 "Protect default branch" carries both a pull_request
      # rule (1 approving review, code-owner review required) and a strict
      # required_status_checks rule on the "Required CI" context, and its only
      # bypass actor is OrganizationAdmin, which a GitHub App cannot be. The
      # direct push this replaced was rejected by that ruleset, which is why
      # nothing has published since 2026-07-05.
      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ steps.push_token.outputs.token }}
        run: |
          set -euo pipefail
          MONTH="$(date +%Y-%m)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/
          if git diff --cached --quiet; then
            echo "::notice::No output changes to publish"
            exit 0
          fi

          branch="data/refresh-${MONTH}"
          git commit -m "data: monthly pipeline refresh ${MONTH}"
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/${branch}"

          if [ -z "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "${branch}" \
              --title "data: monthly pipeline refresh ${MONTH}" \
              --body "Automated corpus refresh for ${MONTH}. Merges once Required CI is green and a code owner approves; the ruleset does not permit the bot to satisfy either on its own."
          else
            echo "::notice::Pull request for ${branch} already open, updated in place"
          fi

          # Arm auto-merge so the approval is the only remaining manual step.
          # This is best-effort: it fails while the required review is missing,
          # which is not a reason to fail the refresh.
          gh pr merge "${branch}" --squash --auto || \
            echo "::notice::Auto-merge not armed yet; the pull request is open and waiting on review"

  verify:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report status
        run: |
          echo "## Pipeline Results"
          echo "Converged: ${{ needs.refresh.outputs.converged }}"
          echo "Runs completed: ${{ needs.refresh.outputs.runs_completed }}"
          echo "Last API calls: ${{ needs.refresh.outputs.last_api_calls }}"
          echo "Job result: ${{ needs.refresh.result }}"

      - name: Re-trigger if not converged
        if: (needs.refresh.result == 'success' || needs.refresh.result == 'cancelled') && needs.refresh.outputs.converged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip re-trigger only if a DIFFERENT run is already in progress
          # (prevents cascade). Exclude the current run: while this verify job
          # executes, its own run is still 'in_progress', so counting it would
          # make a timed-out run always self-skip and stall the chain.
          running=$(gh run list --workflow="Monthly Pipeline Refresh" --status=in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" --repo "${{ github.repository }}")
          if [ "$running" -gt 0 ]; then
            echo "::notice::Another run is already in progress — skipping re-trigger"
            exit 0
          fi
          # Runaway guard: cap total runs per calendar month so a never-converging
          # month cannot cascade into unbounded Actions minutes / API-quota burn.
          MAX_MONTHLY_RUNS=12
          month_start=$(date +%Y-%m-01)
          month_count=$(gh run list --workflow="Monthly Pipeline Refresh" --created ">=${month_start}" --json databaseId --jq 'length' --repo "${{ github.repository }}")
          if [ "$month_count" -ge "$MAX_MONTHLY_RUNS" ]; then
            echo "::warning::Reached ${MAX_MONTHLY_RUNS} runs this month (${month_count}) — not re-triggering to avoid runaway; investigate convergence."
            exit 0
          fi
          echo "Pipeline did not converge — re-triggering; any cache will be reused if persistence succeeded"
          gh workflow run "Monthly Pipeline Refresh" --repo "${{ github.repository }}"
          echo "::notice::Re-triggered workflow. The next run will reuse any cache that was successfully persisted."

      - name: Fail if pipeline errored
        if: needs.refresh.result == 'failure'
        run: |
          echo "::error::Pipeline failed with errors. Check the refresh job logs."
          echo "Cache persistence was not guaranteed — manual re-trigger will resume from any cache that was successfully saved."
          exit 1

  # The website sync moved to citeforge-refresh-merged.yml. Dispatching from
  # here fired on a converged generation, which is upstream of the data
  # actually reaching main: the refresh can converge and its pull request can
  # then sit unreviewed or be closed. The website now syncs from the merge
  # event, which is the only point at which main really carries the new corpus.
