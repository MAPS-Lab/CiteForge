name: Monthly refresh

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without opening a pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a persisted GITHUB_TOKEN header would override the bot token on push
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"

      - run: uv sync --locked

      - name: Build the bibliography
        id: build
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          uv run citeforge
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: run-${{ github.run_id }}
          path: run/
          retention-days: 90

      - name: Open the data pull request
        if: ${{ !inputs.dry_run }}
        env:
          # a pull request pushed or opened with GITHUB_TOKEN starts no workflow, so CI would never run on it
          GH_TOKEN: ${{ secrets.CITEFORGE_BOT_TOKEN }}
          CODE: ${{ steps.build.outputs.code }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          month="$(date -u +%Y-%m)"
          branch="data/refresh-$month"
          title="data: monthly refresh $month"
          [ "$CODE" = 3 ] && title="$title (partial)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add output state data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -q -m "$title"
          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body-file run/report.md
          else
            gh pr edit "$branch" --title "$title" --body-file run/report.md
          fi
