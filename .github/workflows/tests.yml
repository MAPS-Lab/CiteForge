name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Supersede stale PR runs, but never cancel an in-progress run on main: a
  # rapid second merge must not leave a commit on the default branch with
  # cancelled (never-completed) required checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        # The lock file is what gets installed, so it belongs in the key.
        # Keying on pyproject.toml alone leaves the cache stale whenever the
        # lock is regenerated without a pyproject change.
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml', 'requirements-build.lock', 'requirements-dev.lock') }}
        # Scoped to this job's own prefix. A bare `-pip-` fallback restores the
        # first matching cache, including one a different Python leg wrote,
        # which seeds this environment with wheels built for another version.
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
        pip install --no-build-isolation --no-deps -e .

    - name: Verify generated locks are current
      run: |
        uv pip compile pyproject.toml --universal --python-version 3.10 --generate-hashes -o requirements.lock
        uv pip compile pyproject.toml --extra dev --universal --python-version 3.10 --generate-hashes -o requirements-dev.lock
        uv pip compile requirements-build.in --universal --python-version 3.10 --generate-hashes -o requirements-build.lock
        git diff --exit-code -- requirements.lock requirements-dev.lock requirements-build.lock

    - name: Build wheel with locked backend
      run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir /tmp/citeforge-wheel .

    # The wheel was built and discarded, so a packaging break (a module left
    # out of the distribution, a bad entry point) passed CI and only surfaced
    # on install. Import it from a clean venv outside the checkout, where the
    # source tree cannot satisfy the import instead.
    - name: Smoke-test installed wheel
      run: |
        # set -e and the guarded cd both matter. The whole point of this step is
        # to import from somewhere the source tree cannot satisfy the import, so
        # a cd that failed silently would leave the checkout as the working
        # directory and the step would pass against exactly what it exists to
        # rule out.
        set -euo pipefail
        smoke_dir="$(mktemp -d)"
        python -m venv "$smoke_dir/venv"
        "$smoke_dir/venv/bin/pip" install --require-hashes -r requirements.lock
        "$smoke_dir/venv/bin/pip" install --no-deps /tmp/citeforge-wheel/*.whl
        cd "$smoke_dir" || exit 1
        [ "$PWD" != "$GITHUB_WORKSPACE" ] || { echo "::error::smoke test is running inside the checkout"; exit 1; }
        "$smoke_dir/venv/bin/python" -c "import citeforge, citeforge.cli"
        "$smoke_dir/venv/bin/citeforge" --help

    - name: Lint (ruff)
      run: ruff check citeforge/ tests/ main.py

    - name: Type check (mypy)
      run: mypy citeforge/ main.py

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Independent legs run concurrently. They were pinned to max-parallel 1
      # with fail-fast, so a run took the sum of its legs (measured on run
      # 31532991251: legs started at +0s, +50s, +96s, +144s for 194s of wall
      # against 201 billed job-seconds) and a 3.10 failure meant 3.11 through
      # 3.14 never reported at all. Concurrency costs the same billed seconds
      # and returns every version's verdict on the first run.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-build.lock', 'requirements-dev.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-build.lock -r requirements-dev.lock
        pip install --no-build-isolation --no-deps -e .

    # Coverage is a property of the test suite, not of the interpreter, so one
    # canonical version owns it. The other legs prove the suite passes there.
    - name: Run tests with coverage
      if: matrix.python-version == '3.12'
      run: pytest -m 'not live' --cov=citeforge --cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=68

    - name: Run tests
      if: matrix.python-version != '3.12'
      run: pytest -m 'not live'

    - name: Upload coverage report
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 7

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          .pytest_cache/
        retention-days: 7

  # Single aggregate gate. Branch protection requires this one check, so a job
  # added below is covered as soon as it joins the `needs` list, and a renamed
  # job cannot silently stop being required.
  CI:
    name: Required CI
    if: always()
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          # The whole `needs` context as JSON, rather than one env var per job.
          # Enumerating them meant a job added to `needs` above was still not
          # checked here unless this script was edited too, which defeats the
          # point of the gate. Iterating means joining `needs` is sufficient.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A required check must either succeed or skip on purpose via its own
          # `if:` guard. No job in this workflow carries an `if:`, so a `skipped`
          # result means a dependency never ran and is treated as a failure.
          if [ "$(jq 'length' <<<"$NEEDS")" -eq 0 ]; then
            echo "FAIL: the gate has no dependencies, so it would pass vacuously"
            exit 1
          fi
          FAILED=0
          while IFS=$'\t' read -r job result; do
            case "$result" in
              success) echo "OK: $job ($result)" ;;
              skipped) echo "FAIL: $job was skipped; required checks must run"; FAILED=1 ;;
              *)       echo "FAIL: $job ($result)"; FAILED=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")
          exit $FAILED
