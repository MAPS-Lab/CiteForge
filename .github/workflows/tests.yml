name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"

      - run: uv sync --locked

      - run: uv run ruff check citeforge tests

      - run: uv run ruff format --check citeforge tests

      - run: uv run pyrefly check

      - name: Build the wheel and import it outside the checkout
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP"
          uv run --isolated --with "$RUNNER_TEMP"/dist/*.whl citeforge --help

      - run: uv run pytest --cov=citeforge --cov-report=term-missing --cov-fail-under=85

  CI:
    name: Required CI
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          [ "$(jq 'length' <<<"$NEEDS")" -gt 0 ] || { echo "the gate has no dependencies"; exit 1; }
          failed=0
          while IFS=$'\t' read -r job result; do
            echo "$job: $result"
            [ "$result" = success ] || failed=1
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")
          exit $failed
