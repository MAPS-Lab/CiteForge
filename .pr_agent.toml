# Qodo Merge (PR-Agent) repository configuration, read from the default branch.
# Advice only. The required status check is `Required CI` in .github/workflows/tests.yml.

[config]
response_language = "en-US"

[ignore]
glob = ['uv.lock', 'output/**', 'state/**', 'tests/fixtures/**', '.venv/**', 'dist/**']

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = false
require_can_be_split_review = false
require_todo_scan = true
persistent_comment = true
num_max_findings = 5
extra_instructions = """\
Direct and technical. No praise, no restating the diff. Prose avoids em-dashes, avoids colons inside sentences, and never opens a paragraph with a bolded phrase standing in for a heading.

Do not repeat what CI already reports. ruff checks and formats, pyrefly typechecks, and coverage below 85 percent fails the test job. Report only defects a maintainer would act on.

This repository is public. Treat anything that could commit an API key, an email address, a private path or a raw response carrying personal data as a defect. The OpenAlex key comes from OPENALEX_API_KEY or the gitignored keys/ directory and must never be logged or written to output, state or fixtures.

Invariants a change must not break:
- Determinism. The same responses give byte-identical output/ and state/. Every collection that reaches output is sorted.
- Failure never reads as empty. A FAILED fetch keeps the previous state record and never removes a file. Removals need complete listings and a named reason, and the shrink guard holds a member that would lose more than 20 percent and at least 5 entries.
- One work gives the same bytes in every folder, and a file name is unique across the corpus.
- Attribution follows the ordered rule table in citeforge/authorship.py. A name alone never creates an author-work pair.
- Human decisions live only in data/curated.toml, keyed by work id.
- Every request goes through citeforge/http.py to an allowlisted HTTPS host with the generic User-Agent.

Under tests/, no test opens a socket. HTTP replies come from recorded fixtures under tests/fixtures/http or hand-made payloads under tests/fixtures/synthetic. Flag a test skipped or xfailed instead of fixed, and flag an assertion that cannot fail.

In .github/workflows/, every action is pinned by commit SHA with a trailing version comment and every job carries timeout-minutes. A job added to tests.yml must also join the needs list of Required CI.
"""

[pr_code_suggestions]
commitable_code_suggestions = false
focus_only_on_problems = true
persistent_comment = true
extra_instructions = """\
Suggest a change only when the current code is wrong, unsafe, or breaks a stated invariant. Do not suggest stylistic rewrites, abstractions for hypothetical needs, or a dependency where a few lines of the standard library would do.
"""
