[project]
name = "citeforge"
version = "2.0.0"
description = "Per-author BibTeX built from open scholarly registries"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["httpx==0.29.0", "pylatexenc==2.11", "rapidfuzz==3.14.6", "unidecode==1.4.0"]

[project.scripts]
citeforge = "citeforge.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.22",
    "pytest-cov==7.1.0",
    "bibtexparser==1.4.4",
    "ruff==0.17.6",
    "pyrefly==1.5.0",
]

[build-system]
requires = ["uv_build==0.13.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "BLE"]
ignore = ["S101", "S311"]

[tool.pyrefly]
project-includes = ["citeforge", "tests"]
python-interpreter = ".venv/bin/python"
